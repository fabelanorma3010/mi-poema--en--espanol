<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Spanish Poema</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Spanish Poema</h1>
      </header>

      <main>
        <div class="form-container">
          <form id="poem-generator-form">
            <input
              type="text"
              placeholder="Enter the topic of an English poem"
              autofocus
              required
              autocomplete="off"
              class="instructions"
              id="user-instructions"
            />
            <input type="submit" class="submit-button" />
          </form>
          <div class="hint">i.e: amor, flores or vida</div>
        </div>
        <div class="poem hidden" id="poem"></div>
      </main>

      <footer>
        este AI projecto was coded by
        <a href="https://github.com/fabelanorma3010" targerget="_blank"
          >Norma Fabela</a
        >
        <a
          href="https://github.com/fabelanorma3010/Mi-poema-en-espanol"
          target="_blank"
        >
          open-source on GitHub</a
        >
        and is
        <a href="" target="_blank">hosted on vercel</a>.
      </footer>
    </div>

    <script src="src/index.js"></script>
  </body>
</html>
